<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilgi Adası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Plan: deniz haritası tadında tek tema. Derin deniz zemin, parlak adacık sahne, mercan vurgu.
   Düzen: solda ada sahnesi, sağda binalar ve süsler paneli; dar ekranda alt alta. */
:root{
  --deep:#0a3f58;
  --sea:#1a86a3;
  --sand:#f3d9a1;
  --coral:#ff6a4d;
  --ink:#10303c;
  --panel:#f3fbfa;
  --line:#cfe6e3;
  --good:#2e9e5b;
  --bad:#d6453d;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:linear-gradient(180deg,#0a3f58 0%,#0f5f7d 100%) fixed;
  background-color:#0a3f58;
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.45;
  min-height:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:4px 0 16px}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1;color:#fff;letter-spacing:.2px;text-wrap:balance}
.brand p{margin:4px 0 0;color:#bfe7ee;font-weight:600}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--ink);border-radius:999px;padding:5px 14px 5px 10px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.chip.sm{padding:2px 9px 2px 6px;font-size:14px;box-shadow:none;background:#e5f4f2}
.chip.lack{background:#fde3df;color:#9b2b21}
.chip.bump{animation:bump .5s ease}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.free{font-weight:700;color:var(--good);font-size:14px}
.ghost{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700}
.ghost:hover{background:rgba(255,255,255,.24)}
main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:16px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.stage{border-radius:26px;overflow:hidden;background:#1573a0;box-shadow:0 10px 0 rgba(0,0,0,.18)}
#island{display:block;width:100%;height:auto;touch-action:manipulation}
#island.placing{cursor:crosshair}
.status{background:var(--panel);padding:12px 18px;font-weight:700;display:flex;gap:10px;align-items:center;min-height:50px}
.status::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--coral)}
.side{display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border-radius:22px;padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.card h2{margin:0 0 10px;font-family:var(--display);font-size:22px;font-weight:800;line-height:1.1}
.lv{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lv strong{font-family:var(--display);font-size:24px;font-weight:800}
.lv span{font-weight:700;color:#4d6c77;font-variant-numeric:tabular-nums}
.meter{height:12px;border-radius:99px;background:#d6ebe8;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#ffa24d,var(--coral));border-radius:99px;transition:width .5s ease}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1.5px solid var(--line)}
.row:first-child{border-top:0}
.row .rt{display:flex;flex-direction:column;min-width:0}
.row .rt strong{font-weight:800}
.sub{font-size:13px;color:#527380;font-weight:600}
.cost{display:flex;gap:5px;flex-wrap:wrap;grid-column:1}
.row .btn{grid-row:1 / span 2;grid-column:2}
.row:has(.play) .btn{grid-row:1}
.btn{background:var(--coral);color:#fff;border:0;border-radius:12px;padding:8px 16px;font-weight:800;box-shadow:0 3px 0 #c9482e;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #c9482e}
.btn:disabled{background:#b9ccd0;box-shadow:0 3px 0 #98aeb3;color:#fff}
.btn.alt{background:#e5f4f2;color:var(--ink);box-shadow:0 3px 0 #b8d6d2}
.btn.play{background:var(--good);box-shadow:0 3px 0 #1f7a43}
.decs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dec{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 4px;font-weight:800;font-size:14px}
.dec:hover:not(:disabled){border-color:#7cc3c9}
.dec.on{border-color:var(--coral);background:#fff2ee}
.dec:disabled{opacity:.55}
.dec .cost{justify-content:center;grid-column:auto}
.undo{margin-top:10px;width:100%}
.note{font-size:13px;color:#527380;margin:10px 0 0}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:#9fd2dc;font-size:14px;padding:18px 0 6px;font-weight:600}
footer button{background:none;border:0;color:#9fd2dc;text-decoration:underline;padding:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* island svg */
.lbl{font:800 15px var(--display);fill:#fff;stroke:#0a3f58;stroke-width:4.5px;paint-order:stroke;stroke-linejoin:round}
.lbl2{font:700 12.5px var(--body);fill:#fff;stroke:#0a3f58;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.plot{cursor:pointer}
.plot .bld{transition:filter .15s}
.plot:hover .bld{filter:brightness(1.08)}
.plot:focus-visible{outline:3px solid var(--coral);outline-offset:4px}
.plot.ready .padd{stroke:var(--coral);animation:pulse 1.5s ease-in-out infinite}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
.wv{animation:drift 4.5s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(12px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bump{40%{transform:scale(1.18)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* puzzle dialog */
.overlay{position:fixed;inset:0;background:rgba(6,34,48,.66);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.overlay[hidden]{display:none}
.dlg{background:var(--panel);border-radius:26px;width:100%;max-width:580px;max-height:100%;overflow:auto;padding:20px 22px 22px;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dk{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--coral)}
.dh h2{margin:0;font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1}
.x{background:#e5f4f2;border:0;border-radius:50%;width:38px;height:38px;font-size:22px;line-height:1;font-weight:700}
.dots{display:flex;gap:8px;margin:12px 0 16px}
.dot{flex:1;height:8px;border-radius:99px;background:#d6ebe8}
.dot.cur{background:#7cc3c9}
.dot.ok{background:var(--good)}
.dot.no{background:var(--bad)}
.q{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.2;margin:0 0 14px;text-wrap:balance}
.q.big{font-size:40px;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 18px}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:2px 0 18px}
.seq span{min-width:52px;padding:8px 10px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:12px;font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.seq span.qm{background:var(--coral);border-color:var(--coral);color:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{min-height:54px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:17px;text-align:center;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:#7cc3c9}
.opt.good{background:#dff5e6;border-color:var(--good)}
.opt.bad{background:#fde3df;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{min-height:48px;margin:14px 0 0;font-weight:700}
.fb.good{color:#1f7a43}
.fb.bad{color:#9b2b21}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.hint{margin:0 0 14px;font-weight:700;color:#3f6370}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px}
.slots.shake{animation:shake .45s}
.slot{width:44px;height:54px;border-radius:12px;background:#fff;border:2px dashed #a9cfd1;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;font-weight:800}
.slot.on{border-style:solid;border-color:#7cc3c9}
.slots.good .slot{background:#dff5e6;border:2px solid var(--good)}
.slots.bad .slot{background:#fde3df;border:2px solid var(--bad)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:48px;height:54px;border-radius:12px;border:0;background:#ffd166;box-shadow:0 4px 0 #d9a93a;font-family:var(--display);font-size:26px;font-weight:800}
.tile:disabled{background:#e3ece9;box-shadow:none;color:#e3ece9;transform:translateY(3px)}
.ctrl{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.sum{text-align:center;padding:6px 0 0}
.sum .big{font-family:var(--display);font-size:56px;font-weight:800;line-height:1;margin:4px 0}
.sum p{margin:6px 0}
.gains{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.gains .chip{font-size:20px}
/* bölge sekmeleri */
.tabs{display:flex;gap:6px;padding:10px 12px;background:#0f5f7d;flex-wrap:wrap}
.tab{flex:1;min-width:84px;border:0;border-radius:14px;padding:8px 10px;background:rgba(255,255,255,.14);color:#fff;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1;display:flex;flex-direction:column;align-items:center}
.tab small{font-family:var(--body);font-weight:700;font-size:11.5px;opacity:.85}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tab.locked{opacity:.75}
.tab.ready{outline:2px dashed #ffd166;outline-offset:-3px}
/* sahne canlılığı */
.cloud{animation:cloud 38s linear infinite}
@keyframes cloud{from{transform:translateX(-260px)}to{transform:translateX(1060px)}}
.bob{animation:bob 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{from{transform:translateY(-2px) rotate(-2deg)}to{transform:translateY(3px) rotate(2deg)}}
.sway{animation:sway 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.glow{animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:.85}}
.spark{animation:spark 1.1s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes spark{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.6)}}
.fly{animation:fly 22s linear infinite}
@keyframes fly{from{transform:translate(-120px,0)}to{transform:translate(940px,-40px)}}
/* hafıza ve eşleştirme */
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.mcard{min-height:78px;border-radius:16px;border:0;background:linear-gradient(160deg,#1a86a3,#0a3f58);color:#fff;font-family:var(--display);font-weight:800;font-size:19px;padding:6px;box-shadow:0 4px 0 #062a3a;transition:transform .15s}
.mcard.up{background:#fff;color:var(--ink);box-shadow:0 4px 0 #b8d6d2;border:2px solid var(--line)}
.mcard.done{background:#dff5e6;color:#1f7a43;border:2px solid var(--good);box-shadow:none}
.mcard:not(.up):not(.done):hover{transform:translateY(-2px)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{min-height:50px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:17px;padding:6px 8px}
.mt.sel{border-color:var(--coral);background:#fff1ec}
.mt.done{background:#dff5e6;border-color:var(--good);color:#1f7a43}
.mt.no{background:#fde3df;border-color:var(--bad);animation:shake .4s}
.lockrow .sub{white-space:normal}
/* oyuncu girişi */
.who{display:inline-flex;align-items:center;gap:8px;padding:3px 14px 3px 3px}
.who svg{width:32px;height:32px;display:block}
.login{max-width:520px}
.lt{font-family:var(--display);font-size:30px;font-weight:800;margin:0 0 4px}
.lsub{margin:0 0 16px;font-weight:700;color:#3f6370}
.plist{display:grid;gap:10px;margin-bottom:18px}
.pitem{display:flex;gap:6px;align-items:stretch}
.pbtn{flex:1;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 14px 8px 8px;min-width:0}
.pbtn:hover{border-color:var(--sea)}
.pbtn.cur{border-color:var(--good)}
.pbtn strong{font-family:var(--display);font-size:21px;display:block;line-height:1.1}
.pbtn span{font-size:14px;color:#4d6c77;font-weight:700}
.pbtn svg{width:54px;height:54px;flex:none}
.pdel{background:transparent;border:0;color:#9b2b21;font-weight:800;padding:0 8px;font-size:14px}
.newp{background:#fff;border-radius:18px;padding:14px 16px;border:2px dashed #a9cfd1}
.newp h3{margin:0 0 10px;font-family:var(--display);font-size:21px}
.newp label{display:flex;flex-direction:column;gap:6px;font-weight:800}
.newp input{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);color:var(--ink);background:#fff}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.av{border:3px solid transparent;border-radius:50%;padding:2px;background:none}
.av[aria-checked="true"]{border-color:var(--coral)}
.av svg{width:50px;height:50px;display:block}
.lnote{font-size:13px;color:#4d6c77;margin:12px 0 0}
/* ---- v3: şehir haritası ---- */
.mapwrap{position:relative;background:#1f93b5}
#map{display:block;width:100%;height:min(68vh,640px);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.drag{cursor:grabbing}
@media (max-width:860px){#map{height:62vh}}
#map .ob{cursor:pointer}
#map .ob:hover{filter:brightness(1.07)}
#map .ob.sel{filter:drop-shadow(0 0 4px #fff)}
#map .tl:hover{filter:brightness(1.06)}
.zl{font:800 15px var(--display);fill:#fff}
.bn{font:800 12px var(--display);fill:#10303c}
.fx{font:800 18px var(--display);fill:#fff;stroke:#0a3f58;stroke-width:4px;paint-order:stroke;animation:rise 1.2s ease-out forwards}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:12px;border:0;background:#fff;color:var(--ink);font-size:22px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.modebar{position:absolute;left:10px;right:60px;bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(10,63,88,.9);color:#fff;border-radius:14px;padding:8px 8px 8px 14px;font-weight:800}
.modebar[hidden]{display:none}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kpis div{display:flex;flex-direction:column;gap:3px;min-width:0}
.kpis span{font-size:12.5px;font-weight:700;color:#4d6c77}
.kpis b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.meter.sm{height:7px;margin:4px 0 2px}
.warn{margin:10px 0 0;padding:8px 12px;border-radius:12px;background:#fde3df;color:#9b2b21;font-weight:700;font-size:14px}
.qrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1.5px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow .qt{flex:1;font-weight:800;min-width:0}
.qrow .sub{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;font-weight:700;color:#4d6c77}
.qrow.ok .qt{color:#1f7a43}
.gtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.gtab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px}
.gtab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dec .lk{font-size:12px;color:#4d6c77;font-weight:700;text-align:center}
.dec .cost{display:flex;flex-wrap:wrap;gap:3px}
.zrow{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:12px;padding:12px;border-radius:14px;background:#fff7e3;border:2px dashed #f2b134}
.zrow .sub{display:block;font-size:13px;color:#4d6c77;font-weight:700;margin:2px 0 4px}
#selbox{border:3px solid var(--coral)}
#selbox[hidden]{display:none}
.selh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.selh h2{margin:0;font-family:var(--display);font-size:24px}
.selh small{font-size:15px;color:#4d6c77}
.selb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.selb .cost{display:flex;gap:4px;flex-wrap:wrap}
.side h2{margin:0 0 8px}
#map .ob.nat.lk{opacity:.7}
.mintro{text-align:center}
.mbig svg{width:84px;height:100px}
.mhud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.mrule{flex:1 1 100%;font-family:var(--display);font-size:20px;font-weight:800}
.mstat{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700}
.mstat b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.arena{position:relative;height:min(52vh,420px);border-radius:18px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.arena.balon{background:linear-gradient(180deg,#8fd7ec,#d8f3fa)}
.arena.meyve{background:linear-gradient(180deg,#bfe8f3 0%,#e6f7d8 70%,#7cc865 70%,#5fae4f 100%)}
.bln,.frt{position:absolute;left:0;top:0;width:86px;display:flex;flex-direction:column;align-items:center;will-change:transform}
.bln{cursor:pointer}
.bln svg{width:78px;height:108px;display:block}
.bln span{position:absolute;top:22px;left:4px;right:4px;text-align:center;font-family:var(--display);font-weight:800;font-size:16px;color:#fff;text-shadow:0 1px 0 #10303c,0 0 3px #10303c;line-height:1.05;pointer-events:none}
.frt svg{width:56px;height:56px}
.frt span{background:#fff;border:2px solid #10303c;border-radius:10px;padding:1px 6px;font-weight:800;font-size:14px;margin-top:-6px;white-space:nowrap}
.popd{animation:popd .28s ease-out forwards}
@keyframes popd{to{opacity:0;scale:1.5}}
.wrong{animation:wrong .3s ease-out forwards}
@keyframes wrong{50%{filter:grayscale(1) brightness(.7)}to{opacity:0}}
.basket{position:absolute;left:0;bottom:14px;width:110px;height:56px;will-change:transform}
.basket svg{width:100%;height:100%}
.basket.shake svg{animation:shake .4s}
#map .evt{cursor:pointer}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Bilgi Adası</h1>
      <p>Bulmacaları çöz, şehrini kur, adanı büyüt.</p>
    </div>
    <div class="bar">
      <button id="who" class="ghost who" type="button" aria-label="Oyuncu değiştir" hidden></button>
      <div id="res" class="bar" aria-label="Kaynaklar"></div>
      <button id="mute" class="ghost" type="button" aria-pressed="false">Ses açık</button>
    </div>
  </header>

  <main>
    <section class="stage" aria-label="Ada haritası">
      <div class="mapwrap">
        <svg id="map" role="application" aria-label="Ada haritası. Sürükleyerek gez, yakınlaşmak için tekerleği ya da iki parmağı kullan." tabindex="0">
          <defs>
            <pattern id="wavesP" width="120" height="60" patternUnits="userSpaceOnUse">
              <path d="M8 20 q10 -6 20 0 t20 0" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M68 48 q8 -5 16 0 t16 0" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>
            </pattern>
            <radialGradient id="shoreG" cx=".5" cy=".5" r=".5">
              <stop offset=".62" stop-color="#8fe3ea" stop-opacity=".85"/>
              <stop offset="1" stop-color="#8fe3ea" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect x="-2000" y="-1400" width="4000" height="3600" fill="#1f93b5"/>
          <rect x="-2000" y="-1400" width="4000" height="3600" fill="url(#wavesP)" class="wv"/>
          <ellipse cx="0" cy="352" rx="700" ry="360" fill="url(#shoreG)"/>
          <g id="tiles"></g>
          <g id="over"></g>
          <g id="objs"></g>
          <g id="walk" pointer-events="none"></g>
          <g id="fx" pointer-events="none"></g>
          <g id="boats" pointer-events="none"></g>
        </svg>
        <div class="zoom">
          <button type="button" id="zin" aria-label="Yakınlaş">+</button>
          <button type="button" id="zout" aria-label="Uzaklaş">−</button>
          <button type="button" id="zhome" aria-label="Merkeze dön">◎</button>
        </div>
        <div class="modebar" id="modebar" hidden><span id="modetxt"></span><button type="button" class="btn alt" id="cancel">Bitir</button></div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </section>

    <aside class="side">
      <section class="card" id="selbox" hidden></section>
      <section class="card" id="city"></section>
      <section class="card">
        <h2>Görevler</h2>
        <ul class="list" id="quests"></ul>
      </section>
      <section class="card">
        <h2>İnşa et</h2>
        <div class="gtabs" id="gtabs"></div>
        <div class="decs" id="shop"></div>
        <div id="zonebox"></div>
      </section>
    </aside>
  </main>

  <footer>
    <span>Oyuncular ve ilerlemeleri yalnızca bu cihazda saklanır.</span>
    <button id="reset" type="button">Adayı baştan başlat</button>
  </footer>
</div>

<div id="modal" class="overlay" hidden>
  <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" tabindex="-1"><div id="dlgBody"></div></div>
</div>
<div id="login" class="overlay" hidden>
  <div class="dlg login" role="dialog" aria-modal="true" aria-labelledby="loginTitle" tabindex="-1"><div id="loginBody"></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

var state=null, round=null, resetArm=false, mode=null, sel=null, justPlaced=null, grp='ev';
function newGame(){
  var s={v:3,res:{odun:6,tas:4,tohum:4,yildiz:0},zones:['koy'],obj:{},nat:{},played:0,perfect:0,cleared:0,qdone:[],mute:false,last:Date.now()};
  var c=Math.round(C);
  // başlangıç: kütüphane, bir ev ve küçük bir yol
  [[c,c],[c+1,c],[c-1,c],[c,c+1],[c,c-1]].forEach(function(p){s.obj[key(p[0],p[1])]={t:'yol',lv:1};});
  s.obj[key(c+1,c+1)]={t:'kutuphane',lv:1};
  s.obj[key(c-1,c-1)]={t:'ev',lv:1};
  // doğa: ağaçlar ve kayalar
  for(var i=0;i<N;i++)for(var j=0;j<N;j++){
    var t=TILES[i][j];if(t.t!=='grass'||s.obj[key(i,j)])continue;
    if(Math.abs(i-c)<=1&&Math.abs(j-c)<=1)continue;
    var h=hash(i*3+1,j*7+2);
    if(h<.16)s.nat[key(i,j)]=t.d>6?'pine':'tree';else if(h<.22)s.nat[key(i,j)]='rock';
  }
  return s;
}
function sane3(s){
  if(!s||typeof s!=='object'||s.v!==3||!s.obj) return null;
  var d=newGame();
  d.res={};['odun','tas','tohum','yildiz'].forEach(function(k){d.res[k]=Math.max(0,+(s.res&&s.res[k])||0);});
  d.zones=(Array.isArray(s.zones)?s.zones:['koy']).filter(function(z){return zById(z);});if(d.zones.indexOf('koy')<0)d.zones.unshift('koy');
  d.obj={};Object.keys(s.obj).forEach(function(k){var o=s.obj[k],p=unkey(k);if(o&&CAT[o.t]&&tile(p[0],p[1])&&tile(p[0],p[1]).t!=='water')d.obj[k]={t:o.t,lv:Math.min(3,Math.max(1,+o.lv||1)),st:+o.st||0};});
  d.nat={};Object.keys(s.nat||{}).forEach(function(k){if(NAT_DRAW[s.nat[k]]&&!d.obj[k])d.nat[k]=s.nat[k];});
  ['played','perfect','cleared'].forEach(function(k){d[k]=+s[k]||0;});
  d.qdone=Array.isArray(s.qdone)?s.qdone.map(Boolean):[];d.minis=+s.minis||0;d.best=s.best&&typeof s.best==='object'?{balon:+s.best.balon||0,meyve:+s.best.meyve||0}:{};d.mute=!!s.mute;d.last=+s.last||Date.now();
  return d;
}

function migrate(old){
  var s=newGame();
  if(!old||!old.res) return s;
  ['odun','tas','tohum'].forEach(function(k){s.res[k]=Math.max(0,+old.res[k]||0);});
  s.played=+old.played||0;s.res.yildiz=Math.min(60,s.played*2);
  (old.regions||[]).forEach(function(r){if(zById(r)&&s.zones.indexOf(r)<0)s.zones.push(r);});
  (old.built||[]).forEach(function(id){if(CAT[id]&&id!=='kutuphane')autoPlace(s,id);});
  return s;
}
function autoPlace(s,t){
  var best=null;
  for(var i=0;i<N;i++)for(var j=0;j<N;j++){
    var tl=TILES[i][j];if(tl.t!=='grass'||s.zones.indexOf(tl.z)<0||s.obj[key(i,j)])continue;
    var near=[[1,0],[-1,0],[0,1],[0,-1]].some(function(d){var o=s.obj[key(i+d[0],j+d[1])];return o&&o.t==='yol';});
    var sc=tl.d+(near?0:3);if(!best||sc<best[2])best=[i,j,sc,near];
  }
  if(!best) return;
  delete s.nat[key(best[0],best[1])];s.obj[key(best[0],best[1])]={t:t,lv:1};
  if(!best[3]){[[1,0],[0,1],[-1,0],[0,-1]].some(function(d){var k=key(best[0]+d[0],best[1]+d[1]),tl=tile(best[0]+d[0],best[1]+d[1]);if(tl&&tl.t!=='water'&&!s.obj[k]){delete s.nat[k];s.obj[k]={t:'yol',lv:1};return true;}return false;});}
}

function hasRoad(i,j){return [[1,0],[-1,0],[0,1],[0,-1]].some(function(d){var o=state.obj[key(i+d[0],j+d[1])];return o&&o.t==='yol';});}
function works(k){var o=state.obj[k],c=CAT[o.t];if(c.road||c.happy)return true;var p=unkey(k);return hasRoad(p[0],p[1]);}
function stats(st){
  st=st||state;
  var m={pop:0,houses:0,roads:0,work:0,prod:0,know:0,decor:0,happyPts:0,maxLv:1,cut:0,types:{}};
  var save=state;state=st;
  Object.keys(st.obj).forEach(function(k){
    var o=st.obj[k],c=CAT[o.t];m.types[o.t]=(m.types[o.t]||0)+1;if(o.lv>m.maxLv&&!c.road&&!c.happy)m.maxLv=o.lv;
    var ok=works(k);if(!ok)m.cut++;
    if(c.road)m.roads++;
    else if(c.pop){m.houses++;if(ok)m.pop+=c.pop*o.lv;}
    else if(c.make){m.prod++;if(ok)m.work+=c.work;}
    else if(c.know){m.know++;}
    else if(c.happy){m.decor++;m.happyPts+=c.happy;}
  });
  state=save;
  m.happy=Math.max(5,Math.min(100,Math.round(55+m.happyPts*1.5+m.know*2-m.houses*3)));
  m.workRatio=m.work?Math.min(1,m.pop/m.work):1;
  m.speed=m.workRatio*(.5+m.happy/100);
  return m;
}
var TITLES=[[0,'Issız Kumsal'],[4,'Küçük Köy'],[12,'Şirin Köy'],[24,'Kasaba'],[40,'Büyük Kasaba'],[64,'İlçe'],[100,'Bilgelik Şehri']];
function titleOf(pop){var t=TITLES[0][1];TITLES.forEach(function(x){if(pop>=x[0])t=x[1];});return t;}
function levelOf(st){var m=stats(st);return titleOf(m.pop)+' · '+m.pop+' nüfus';}
var RATE=1/40; // seviye 1: 40 saniyede 1 kaynak (tam hızda)
function capOf(o){return 6*o.lv+4;}
function tick(){
  var now=Date.now(),dt=Math.min(8*3600,Math.max(0,(now-state.last)/1000));state.last=now;
  if(!dt) return false;
  var m=stats(),changed=false;
  Object.keys(state.obj).forEach(function(k){
    var o=state.obj[k],c=CAT[o.t];if(!c.make||!works(k))return;
    var before=Math.floor(o.st||0);o.st=Math.min(capOf(o),(o.st||0)+dt*RATE*o.lv*m.speed);
    if(Math.floor(o.st)!==before)changed=true;
  });
  return changed;
}

function questState(){
  var m=stats();
  m.cutHouses=Object.keys(state.obj).filter(function(k){return CAT[state.obj[k].t].pop&&!works(k);}).length;
  var out=[];
  QUESTS.forEach(function(q,i){if(state.qdone[i]||out.length>=3)return;var p=q.p(m);out.push({i:i,q:q,cur:Math.min(p[0],p[1]),max:p[1],ok:p[0]>=p[1]});});
  return out;
}
function claimQuest(i){
  var q=QUESTS[i],list=questState().filter(function(x){return x.i===i&&x.ok;});
  if(!list.length) return;
  state.qdone[i]=true;pay(q.rw,1);good();save();
  toast('Görev tamam! Ödül: '+costText(q.rw)+'.');refresh(q.rw);
}

var cam={x:0,y:Math.round(C)*TH,z:1}, view={w:800,h:520};
function fitView(){
  var svg=$('#map'),r=svg.getBoundingClientRect();
  view.w=r.width||800;view.h=r.height||520;
  applyCam();
}
function applyCam(){
  cam.z=Math.max(.45,Math.min(2.6,cam.z));
  var minX=-N*TW/2,maxX=N*TW/2,minY=0,maxY=N*TH;
  cam.x=Math.max(minX,Math.min(maxX,cam.x));cam.y=Math.max(minY,Math.min(maxY,cam.y));
  var w=view.w/cam.z,h=view.h/cam.z;
  $('#map').setAttribute('viewBox',(cam.x-w/2).toFixed(1)+' '+(cam.y-h/2).toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1));
}
function diamond(x,y){return (x)+','+(y-TH/2)+' '+(x+TW/2)+','+y+' '+x+','+(y+TH/2)+' '+(x-TW/2)+','+y;}
function renderTiles(){
  var out=[],dep=14;
  var order=[];for(var i=0;i<N;i++)for(var j=0;j<N;j++)order.push([i,j]);
  order.sort(function(a,b){return (a[0]+a[1])-(b[0]+b[1]);});
  order.forEach(function(p){
    var i=p[0],j=p[1],t=TILES[i][j];if(t.t==='water')return;
    var s=iso(i,j),x=s.x,y=s.y,open=zoneOpen(t.z);
    var fill=t.t==='sand'?(t.v>.5?'#f6dfa6':'#f0d596'):(t.v>.66?'#7cc865':t.v>.33?'#74c05f':'#6cb858');
    if(!open) fill=t.t==='sand'?'#cdbb8e':(t.v>.5?'#6f9a6a':'#679263');
    var r=tile(i+1,j),b=tile(i,j+1);
    if(!r||r.t==='water') out.push('<polygon points="'+(x+TW/2)+','+y+' '+x+','+(y+TH/2)+' '+x+','+(y+TH/2+dep)+' '+(x+TW/2)+','+(y+dep)+'" fill="#d1a565"/>');
    if(!b||b.t==='water') out.push('<polygon points="'+x+','+(y+TH/2)+' '+(x-TW/2)+','+y+' '+(x-TW/2)+','+(y+dep)+' '+x+','+(y+TH/2+dep)+'" fill="#b98a4c"/>');
    out.push('<polygon class="tl" points="'+diamond(x,y)+'" fill="'+fill+'" stroke="'+(open?'rgba(0,0,0,.05)':'rgba(0,0,0,.12)')+'" stroke-width="1" data-t="'+i+','+j+'"/>');
    if(open&&t.t==='grass'&&t.v>.86) out.push('<path d="M'+(x-6)+' '+(y+2)+' l-2 -6 m2 6 l1 -7 m-1 7 l4 -5" stroke="#3f8f45" stroke-width="1.6" stroke-linecap="round" pointer-events="none"/>');
  });
  // kilitli bölge etiketleri

    out.push('<g transform="translate('+s.x+' '+(s.y-10)+')" pointer-events="none"><rect x="-70" y="-20" width="140" height="40" rx="14" fill="#0a3f58" opacity=".82"/>'+
      '<g transform="translate(-50 0) scale(.42)">'+OL+'<path d="M-14 -4 V-16 a14 14 0 0 1 28 0 V-4" fill="none" stroke="#fff" stroke-width="7"/><rect x="-21" y="-6" width="42" height="32" rx="7" fill="#ffd166"/></g></g>'+
      '<text x="8" y="6" text-anchor="middle" class="zl">'+z.name+' · kilitli</text></g>');
  });
  $('#tiles').innerHTML=out.join('');
}
function bubble(o){
  var c=CAT[o.t];
  if(c.make&&o.st>=1) return '<g class="bob" transform="translate(0 -58)"><circle r="13" fill="#fff" stroke="#10303c" stroke-width="2"/><g transform="translate(-9 -9)">'+RES[c.make].svg.replace('width="18" height="18"','width="18" height="18"')+'</g><text x="14" y="-8" class="bn">'+Math.floor(o.st)+'</text></g>';
  return '';

    var lk=!zoneOpen(TILES[p[0]][p[1]].z);

  });
  Object.keys(state.obj).forEach(function(k){
    var o=state.obj[k],c=CAT[o.t],p=unkey(k),s=iso(p[0],p[1]);
    if(c.road){
      var nb=[[1,0],[-1,0],[0,1],[0,-1]].map(function(d){var q=state.obj[key(p[0]+d[0],p[1]+d[1])];return q&&q.t==='yol';});

      var cx=s.x,cy=s.y,ends=[[TW/4,TH/4],[-TW/4,-TH/4],[-TW/4,TH/4],[TW/4,-TH/4]];
      nb.forEach(function(on,n){if(on)road+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+ends[n][0])+'" y2="'+(cy+ends[n][1])+'" stroke="#fff" stroke-width="1.6" stroke-dasharray="4 4" opacity=".8" pointer-events="none"/>';});
      items.push({d:-1,s:road});return;
    }
    var flat=o.t==='tarla'||o.t==='park';
    var body='<g class="ob'+(k===justPlaced?' pop':'')+(sel===k?' sel':'')+'" data-t="'+k+'" transform="translate('+s.x+' '+(s.y+(flat?2:8))+')">'+
      (flat?'':'<ellipse cx="0" cy="-2" rx="24" ry="9" fill="#0a3f58" opacity=".18"/>')+objDraw(o,p[0],p[1])+
      (o.lv>1&&!c.happy?'<g transform="translate(20 -8)"><circle r="8" fill="#ffd166" stroke="#10303c" stroke-width="2"/><text y="4" text-anchor="middle" class="bn" style="font-size:11px">'+o.lv+'</text></g>':'')+
      (!works(k)?'<g transform="translate(-20 -40)"><circle r="9" fill="#d6453d" stroke="#fff" stroke-width="2"/><text y="4.5" text-anchor="middle" class="bn" style="fill:#fff;font-size:13px">!</text></g>':'')+
      bubble(o)+'</g>';
    items.push({d:p[0]+p[1]+(flat?-.5:0),s:body});
  });
  if(ev){var ep=unkey(ev.k),es=iso(ep[0],ep[1]);items.push({d:999,s:'<g class="ob evt" data-t="'+ev.k+'" transform="translate('+es.x+' '+(es.y+6)+')">'+eventSVG(ev.kind)+'</g>'});}
  items.sort(function(a,b){return a.d-b.d;});
  $('#objs').innerHTML=items.map(function(x){return x.s;}).join('');
  justPlaced=null;
}
function canPlace(t,i,j){
  var c=CAT[t],tl=tile(i,j),k=key(i,j);
  if(!tl||tl.t==='water') return 'Buraya inşa edilmez.';
  if(!zoneOpen(tl.z)) return 'Bu bölge henüz kilitli.';
  if(state.obj[k]) return 'Burası dolu.';
  if(ev&&ev.k===k) return 'Burada bir sürpriz var, önce ona dokun.';
  if(state.nat[k]) return 'Önce bu '+(state.nat[k]==='rock'?'kayaya':'ağaca')+' dokunup topla.';
  if(tl.t==='sand'&&!c.sand) return 'Kumsala sadece yol ve süs konur.';
  return '';
}
function renderOverlay(){
  var out='';

    for(var i=0;i<N;i++)for(var j=0;j<N;j++){
      var tl=TILES[i][j];if(tl.t==='water'||!zoneOpen(tl.z))continue;
      var ok=!canPlace(mode,i,j),s=iso(i,j);
      if(ok) out+='<polygon points="'+diamond(s.x,s.y)+'" fill="'+(CAT[mode].road||CAT[mode].happy||hasRoad(i,j)?'#fff':'#ffd166')+'" opacity=".32" pointer-events="none"/>';

}
function fx(i,j,text){

  g.setAttribute('x',s.x);g.setAttribute('y',s.y-40);g.setAttribute('text-anchor','middle');g.setAttribute('class','fx');g.textContent=text;

/* --- yürüyen köylüler --- */
var walkers=[],lastFrame=0;
var SHIRTS=['#e4572e','#3b6ea5','#f2b134','#7b5ea7','#2e9e5b','#ff8fb3'];
function roadList(){return Object.keys(state.obj).filter(function(k){return state.obj[k].t==='yol';});}
function syncWalkers(){
  var roads=roadList(),want=roads.length<2?0:Math.min(14,Math.ceil(stats().pop/4));
  while(walkers.length>want){walkers.pop().el.remove();}
  while(walkers.length<want){
    var k=roads[rnd(0,roads.length-1)],el=document.createElementNS('http://www.w3.org/2000/svg','g');
    el.innerHTML='<ellipse cx="0" cy="0" rx="4" ry="1.8" fill="#0a3f58" opacity=".25"/><rect x="-3" y="-10" width="6" height="8" rx="2.5" fill="'+SHIRTS[walkers.length%SHIRTS.length]+'" stroke="#10303c" stroke-width="1.2"/><circle cx="0" cy="-13" r="3.2" fill="#f3c9a1" stroke="#10303c" stroke-width="1.2"/>';
    $('#walk').appendChild(el);walkers.push({el:el,from:k,to:k,t:1,sp:.5+Math.random()*.4});
  }
}
function stepWalkers(ts){
  var dt=Math.min(.05,(ts-lastFrame)/1000||0);lastFrame=ts;
  walkers.forEach(function(w){
    w.t+=dt*w.sp;
    if(w.t>=1){
      w.from=w.to;var p=unkey(w.from);
      var nb=[[1,0],[-1,0],[0,1],[0,-1]].map(function(d){return key(p[0]+d[0],p[1]+d[1]);}).filter(function(k){var o=state.obj[k];return o&&o.t==='yol';});
      if(!state.obj[w.from]||state.obj[w.from].t!=='yol'){var r=roadList();if(r.length)w.from=r[rnd(0,r.length-1)];nb=[];}
      w.to=nb.length?nb[rnd(0,nb.length-1)]:w.from;w.t=0;
    }
    var a=unkey(w.from),b=unkey(w.to),A=iso(a[0],a[1]),B=iso(b[0],b[1]);
    var x=A.x+(B.x-A.x)*w.t+(w.sp-.7)*14,y=A.y+(B.y-A.y)*w.t+(w.sp-.7)*6;
    w.el.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+')');
  });
  requestAnimationFrame(stepWalkers);
}

function tapTile(k){
  var p=unkey(k),i=p[0],j=p[1];
  if(ev&&ev.k===k){var kd=ev.kind;ev=null;evClock=0;evNext=rnd(70,120);mode=null;renderObjects();openMini(kd);return;}
  if(mode){
    var why=canPlace(mode,i,j);
    if(why){toast(why);bad();return;}
    var c=CAT[mode];
    if(!canPay(c.cost)){toast('Kaynak yetmiyor: '+costText(c.cost)+'.');mode=null;refresh();return;}
    pay(c.cost,-1);state.obj[k]={t:mode,lv:1,st:0};justPlaced=k;beep(c.road?620:700,.08);if(!c.road)setTimeout(function(){beep(900,.1);},90);
    if(c.unique||!canPay(c.cost)){mode=null;if(!c.road)sel=k;}
    if(!c.road&&!c.happy&&!hasRoad(i,j)) toast(c.name+' kuruldu. Çalışması için yanına yol yap.');
    save();refresh();return;
  }
  if(state.nat[k]){
    var n=state.nat[k];if(!zoneOpen(TILES[i][j].z)){toast('Bu '+(n==='rock'?'kaya':'ağaç')+' '+zById(TILES[i][j].z).name+' bölgesinde. Önce o bölgeyi aç.');return;}
    delete state.nat[k];state.cleared++;
    var r=n==='rock'?'tas':'odun',g=n==='rock'?2:3;state.res[r]+=g;var bm={};bm[r]=1;
    fx(i,j,'+'+g+' '+RES[r].name.toLowerCase());good();save();refresh(bm);return;
  }
  var o=state.obj[k];

  sel=k;refresh();
}

}
function doSel(act){

  if(act==='play'){if(!works(sel)){toast('Önce yola bağla.');return;}round=null;startRound(c.know,o.lv);return;}
  if(act==='collect'){collect(sel);return;}

function miniLoop(ts){
  if(!mini||!mini.run)return;

function opts(ans,extra){
  var c=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10].concat(extra||[]);
  var seen={};seen[ans]=1;
  c=c.filter(function(v){if(v<0||seen[v])return false;seen[v]=1;return true;});
  var list=shuffle([ans].concat(shuffle(c).slice(0,3)));
  return {options:list.map(String),answer:list.indexOf(ans)};
}
function seqQ(){
  var t=rnd(0,4),s=[],ans,rule,i;
  if(t===0){var a=rnd(1,20),d=rnd(2,9);for(i=0;i<5;i++)s.push(a+d*i);ans=a+d*5;rule='Her adımda '+d+' artıyor.';}
  else if(t===1){var a1=rnd(1,4),r=rnd(2,3);for(i=0;i<5;i++)s.push(a1*Math.pow(r,i));ans=a1*Math.pow(r,5);rule='Her sayı, öncekinin '+r+' katı.';}
  else if(t===2){var x=rnd(1,10),p=rnd(1,5),q=rnd(p+1,p+5);s=[x];for(i=0;i<4;i++)s.push(s[i]+(i%2===0?p:q));ans=s[4]+p;rule='Sırayla +'+p+' ve +'+q+' ekleniyor.';}
  else if(t===3){var k=rnd(1,5);for(i=0;i<5;i++)s.push((k+i)*(k+i));ans=(k+5)*(k+5);rule='Ardışık sayıların kareleri.';}
  else{var a2=rnd(40,80),d2=rnd(3,8);for(i=0;i<5;i++)s.push(a2-d2*i);ans=a2-d2*5;rule='Her adımda '+d2+' azalıyor.';}
  var o=opts(ans);

}
function mathQ(){
  var t=rnd(0,3),q,a,x,y;

  else if(t===2){x=rnd(3,12);y=rnd(3,12);q=x+' × '+y;a=x*y;}

function bankQ(item){

function anaQ(w){

/* Havuz bitene kadar aynı soruyu tekrar sormaz; son görülenler cihazda saklanır. */
function seenKey(){return 'bilgiAdasi.seen.'+(prof?prof.id:'');}
var seen={};
function loadSeen(){try{var v=JSON.parse(localStorage.getItem(seenKey()));seen=v&&typeof v==='object'?v:{};}catch(e){seen={};}}
function pick(key,list,n){
  var r=Array.isArray(seen[key])?seen[key]:[];
  var idx=list.map(function(_,i){return i;});
  var fresh=shuffle(idx.filter(function(i){return r.indexOf(i)<0;}));
  var stale=shuffle(idx.filter(function(i){return r.indexOf(i)>=0;}));
  var chosen=fresh.concat(stale).slice(0,n);
  seen[key]=r.filter(function(i){return chosen.indexOf(i)<0&&i<list.length;}).concat(chosen).slice(-Math.max(0,list.length-n));
  try{localStorage.setItem(seenKey(),JSON.stringify(seen));}catch(e){}
  return chosen.map(function(i){return list[i];});
}
function problemQ(){
  var t=rnd(0,3),q,a,x,y;
  var meyve=['elma','armut','portakal','şeftali'][rnd(0,3)];
  if(t===0){x=rnd(2,9);y=rnd(3,9);q='Bir '+meyve+' '+x+' TL. '+y+' tane '+meyve+' kaç TL eder?';a=x*y;}
  else if(t===1){x=[20,50,100][rnd(0,2)];y=rnd(5,x-3);q=x+' TL ile '+y+' TL\'lik bir oyuncak aldın. Kaç TL para üstü alırsın?';a=x-y;}
  else if(t===2){y=rnd(2,6);a=rnd(3,9);x=a*y;q=x+' ceviz '+y+' arkadaşa eşit paylaştırılıyor. Her biri kaç ceviz alır?';}
  else{x=rnd(12,48);y=rnd(8,40);var z=rnd(3,Math.min(15,x+y-1));q='Tezgâhta '+x+' elma ve '+y+' armut vardı. '+z+' meyve satıldı. Kaç meyve kaldı?';a=x+y-z;}
  var o=opts(a,[a+5,a-5]);
  return {kind:'mc',prompt:q,options:o.options,answer:o.answer,explain:'Cevap: '+a+'.'};
}
function clock(t){t=((t%720)+720)%720;var h=Math.floor(t/60),m=t%60;return (h===0?12:h)+':'+(m<10?'0':'')+m;}
function saatQ(){
  var start=rnd(1,11)*60+rnd(0,11)*5,add=rnd(2,20)*5,ans=start+add;
  var c=[ans+15,ans-15,ans+60,ans-60,ans+5,ans-10,ans+30],seen={},list=[ans];seen[clock(ans)]=1;
  shuffle(c).forEach(function(v){if(list.length<4&&!seen[clock(v)]){seen[clock(v)]=1;list.push(v);}});
  list=shuffle(list);
  var dur=add>=60?Math.floor(add/60)+' saat'+(add%60?' '+add%60+' dakika':''):add+' dakika';
  return {kind:'mc',prompt:'Saat '+clock(start)+'. '+dur+' sonra saat kaç olur?',options:list.map(clock),answer:list.indexOf(ans),explain:clock(start)+' + '+dur+' = '+clock(ans)};
}
function memQ(pairs){
  var cards=[];
  pairs.forEach(function(p,k){cards.push({t:p[0],p:k,open:false,done:false});cards.push({t:p[1],p:k,open:false,done:false});});
  return {kind:'mem',cards:shuffle(cards),first:null,miss:0,busy:false};
}
function carpimPairs(){
  var out=[],used={};
  while(out.length<3){var a=rnd(3,9),b=rnd(3,9);if(used[a*b])continue;used[a*b]=1;out.push([a+' × '+b,String(a*b)]);}
  return out;
}
function matchQ(pairs){
  return {kind:'match',L:shuffle(pairs.map(function(p,k){return {t:p[0],p:k};})),R:shuffle(pairs.map(function(p,k){return {t:p[1],p:k};})),sel:null,done:{},miss:0,bad:null};
}
var LONG=WORDS.filter(function(w){return Array.from(w.w).length>=6;});
function makeQs(b){
  if(b.game==='anagram'&&b.words==='uzun') return pick('uzun',LONG,3).map(anaQ);
  if(b.game==='anagram') return pick('kelime',WORDS,3).map(anaQ);
  if(b.game==='dy') return pick('dy',TF,3).map(function(x){return {kind:'mc',prompt:x.s,options:['Doğru','Yanlış'],answer:x.t?0:1,explain:x.e};});
  if(b.game==='problem') return [problemQ(),problemQ(),problemQ()];
  if(b.game==='saat') return [saatQ(),saatQ(),saatQ()];
  if(b.game==='hafiza'&&b.set==='carpim') return [memQ(carpimPairs()),memQ(carpimPairs()),memQ(carpimPairs())];
  if(b.game==='hafiza'){var bp=pick('baskent',BASKENT,9);return [memQ(bp.slice(0,3)),memQ(bp.slice(3,6)),memQ(bp.slice(6,9))];}
  if(b.game==='eslestir'){var ep=pick('esanlam',ESANLAM,12);return [matchQ(ep.slice(0,4)),matchQ(ep.slice(4,8)),matchQ(ep.slice(8,12))];}
  if(b.game==='quiz') return pick(b.cat,BANK[b.cat],3).map(bankQ);
  if(b.game==='dizi') return [seqQ(),seqQ(),seqQ()];
  return [mathQ(),mathQ(),mathQ()];
}

(function(){
  var svg=$('#map'),pts={},downT=null,moved=false,start=null,pinch=null;
  function dist(){var a=Object.keys(pts).map(function(k){return pts[k];});return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
  svg.addEventListener('pointerdown',function(e){
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    if(Object.keys(pts).length===1){var t=e.target.closest&&e.target.closest('[data-t]');downT=t?t.getAttribute('data-t'):null;moved=false;start={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};}
    else{pinch={d:dist(),z:cam.z};moved=true;}
    try{svg.setPointerCapture(e.pointerId);}catch(err){}
  });
  svg.addEventListener('pointermove',function(e){
    if(!pts[e.pointerId])return;
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var n=Object.keys(pts).length;
    if(n===1&&start){
      var dx=e.clientX-start.x,dy=e.clientY-start.y;
      if(!moved&&Math.hypot(dx,dy)>7){moved=true;svg.classList.add('drag');}
      if(moved){cam.x=start.cx-dx/cam.z;cam.y=start.cy-dy/cam.z;applyCam();}
    }else if(n===2&&pinch){cam.z=pinch.z*dist()/pinch.d;applyCam();}
  });
  function up(e){
    if(!pts[e.pointerId])return;
    delete pts[e.pointerId];
    var n=Object.keys(pts).length;
    if(n===0){
      svg.classList.remove('drag');
      if(!moved&&e.type==='pointerup'){
        if(downT) tapTile(downT);
        else if(sel){sel=null;refresh();}
      }
      start=null;pinch=null;
    }else if(n===1){var k=Object.keys(pts)[0];start={x:pts[k].x,y:pts[k].y,cx:cam.x,cy:cam.y};pinch=null;}
  }
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',function(e){e.preventDefault();cam.z*=Math.exp(-e.deltaY*.0015);applyCam();},{passive:false});
  svg.addEventListener('keydown',function(e){
    var step=60/cam.z;
    if(e.key==='ArrowLeft')cam.x-=step;else if(e.key==='ArrowRight')cam.x+=step;else if(e.key==='ArrowUp')cam.y-=step;else if(e.key==='ArrowDown')cam.y+=step;
    else if(e.key==='+'||e.key==='=')cam.z*=1.2;else if(e.key==='-')cam.z/=1.2;else return;
    e.preventDefault();applyCam();
  });
  window.addEventListener('resize',fitView);
})();

  if(e.target.closest('[data-magain]')&&mini){openMini(mini.kind);return;}
  if(!round) return;
  var o=e.target.closest('[data-opt]');if(o){answerMC(+o.getAttribute('data-opt'));return;}
  var t=e.target.closest('[data-tile]');if(t){anaAdd(+t.getAttribute('data-tile'));return;}
  var mc=e.target.closest('[data-card]');if(mc){memFlip(+mc.getAttribute('data-card'));return;}
  var ml=e.target.closest('[data-ml]');if(ml){matchPick('l',+ml.getAttribute('data-ml'));return;}
  var mr=e.target.closest('[data-mr]');if(mr){matchPick('r',+mr.getAttribute('data-mr'));return;}
  var a=e.target.closest('[data-ana]');
  if(a){var m=a.getAttribute('data-ana');if(m==='back')anaBack();else if(m==='mix')anaMix();else anaSkip();return;}
  if(e.target.closest('[data-next]')){nextQ();return;}
  if(e.target.closest('[data-again]')){startRound(round.b,round.lv);return;}
});
$('#who').addEventListener('click',openLogin);
$('#login').addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-prof]'))){selectProfile(t.getAttribute('data-prof'));return;}
  if((t=e.target.closest('[data-pdel]'))){deleteProfile(t.getAttribute('data-pdel'));return;}
  if((t=e.target.closest('[data-av]'))){newAv=t.getAttribute('data-av');document.querySelectorAll('.av').forEach(function(b){b.setAttribute('aria-checked',String(b===t));});return;}
  if(e.target.closest('[data-lclose]')||e.target.id==='login') closeLogin();
});
$('#login').addEventListener('submit',function(e){e.preventDefault();createProfile($('#pname').value,newAv);});
document.addEventListener('keydown',function(e){
  if(!$('#login').hidden){if(e.key==='Escape')closeLogin();return;}
  if($('#modal').hidden){if(e.key==='Escape'&&(mode||sel)){mode=null;sel=null;refresh();}return;}
  if(e.key==='Escape'){closeModal();return;}
  if(!round||round.locked) return;
  var q=round.qs[round.i];
  if(q.kind!=='ana'||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='Backspace'){e.preventDefault();anaBack();return;}
  if(e.key.length!==1) return;
  var K=e.key.toLocaleUpperCase('tr'),idx=-1;
  q.tiles.forEach(function(t,i){if(idx<0&&!t.used&&t.ch===K)idx=i;});
  if(idx<0){var K2=e.key.toUpperCase();q.tiles.forEach(function(t,i){if(idx<0&&!t.used&&t.ch.toUpperCase()===K2)idx=i;});}
  if(idx>=0){e.preventDefault();anaAdd(idx);}
});

/* ---------- açılış ---------- */
setInterval(function(){
  if(!state||!prof)return;
  if(tick()){save();renderObjects();if(sel)renderSel();}
  if(!document.hidden&&$('#modal').hidden&&$('#login').hidden&&!ev){evClock++;if(evClock>=evNext)spawnEvent();}
},1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&state&&prof){tick();refresh();}});
function start(){
  profiles=loadProfiles();
  var cur=profiles.list.filter(function(p){return p.id===profiles.current;})[0];
  fitView();renderBoats();
  if(cur){selectProfile(cur.id,true);}
  else{prof=null;state=newGame();renderTiles();refresh();openLogin();}
  centerCam();
  requestAnimationFrame(stepWalkers);
}
start();
})();
</script>
</body>
