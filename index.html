<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilgi Adası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Plan: deniz haritası tadında tek tema. Derin deniz zemin, parlak adacık sahne, mercan vurgu.
   Düzen: solda ada sahnesi, sağda binalar ve süsler paneli; dar ekranda alt alta. */
:root{
  --deep:#0a3f58;
  --sea:#1a86a3;
  --sand:#f3d9a1;
  --coral:#ff6a4d;
  --ink:#10303c;
  --panel:#f3fbfa;
  --line:#cfe6e3;
  --good:#2e9e5b;
  --bad:#d6453d;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:linear-gradient(180deg,#0a3f58 0%,#0f5f7d 100%) fixed;
  background-color:#0a3f58;
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.45;
  min-height:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:4px 0 16px}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1;color:#fff;letter-spacing:.2px;text-wrap:balance}
.brand p{margin:4px 0 0;color:#bfe7ee;font-weight:600}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--ink);border-radius:999px;padding:5px 14px 5px 10px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.chip.sm{padding:2px 9px 2px 6px;font-size:14px;box-shadow:none;background:#e5f4f2}
.chip.lack{background:#fde3df;color:#9b2b21}
.chip.bump{animation:bump .5s ease}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.free{font-weight:700;color:var(--good);font-size:14px}
.ghost{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700}
.ghost:hover{background:rgba(255,255,255,.24)}
main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:16px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.stage{border-radius:26px;overflow:hidden;background:#1573a0;box-shadow:0 10px 0 rgba(0,0,0,.18)}
#island{display:block;width:100%;height:auto;touch-action:manipulation}
#island.placing{cursor:crosshair}
.status{background:var(--panel);padding:12px 18px;font-weight:700;display:flex;gap:10px;align-items:center;min-height:50px}
.status::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--coral)}
.side{display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border-radius:22px;padding:16px 18px;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.card h2{margin:0 0 10px;font-family:var(--display);font-size:22px;font-weight:800;line-height:1.1}
.lv{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.lv strong{font-family:var(--display);font-size:24px;font-weight:800}
.lv span{font-weight:700;color:#4d6c77;font-variant-numeric:tabular-nums}
.meter{height:12px;border-radius:99px;background:#d6ebe8;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#ffa24d,var(--coral));border-radius:99px;transition:width .5s ease}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1.5px solid var(--line)}
.row:first-child{border-top:0}
.row .rt{display:flex;flex-direction:column;min-width:0}
.row .rt strong{font-weight:800}
.sub{font-size:13px;color:#527380;font-weight:600}
.cost{display:flex;gap:5px;flex-wrap:wrap;grid-column:1}
.row .btn{grid-row:1 / span 2;grid-column:2}
.row:has(.play) .btn{grid-row:1}
.btn{background:var(--coral);color:#fff;border:0;border-radius:12px;padding:8px 16px;font-weight:800;box-shadow:0 3px 0 #c9482e;white-space:nowrap}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #c9482e}
.btn:disabled{background:#b9ccd0;box-shadow:0 3px 0 #98aeb3;color:#fff}
.btn.alt{background:#e5f4f2;color:var(--ink);box-shadow:0 3px 0 #b8d6d2}
.btn.play{background:var(--good);box-shadow:0 3px 0 #1f7a43}
.decs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.dec{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 4px;font-weight:800;font-size:14px}
.dec:hover:not(:disabled){border-color:#7cc3c9}
.dec.on{border-color:var(--coral);background:#fff2ee}
.dec:disabled{opacity:.55}
.dec .cost{justify-content:center;grid-column:auto}
.undo{margin-top:10px;width:100%}
.note{font-size:13px;color:#527380;margin:10px 0 0}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;color:#9fd2dc;font-size:14px;padding:18px 0 6px;font-weight:600}
footer button{background:none;border:0;color:#9fd2dc;text-decoration:underline;padding:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* island svg */
.lbl{font:800 15px var(--display);fill:#fff;stroke:#0a3f58;stroke-width:4.5px;paint-order:stroke;stroke-linejoin:round}
.lbl2{font:700 12.5px var(--body);fill:#fff;stroke:#0a3f58;stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.plot{cursor:pointer}
.plot .bld{transition:filter .15s}
.plot:hover .bld{filter:brightness(1.08)}
.plot:focus-visible{outline:3px solid var(--coral);outline-offset:4px}
.plot.ready .padd{stroke:var(--coral);animation:pulse 1.5s ease-in-out infinite}
.pop{transform-box:fill-box;transform-origin:50% 100%;animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
.wv{animation:drift 4.5s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(12px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bump{40%{transform:scale(1.18)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* puzzle dialog */
.overlay{position:fixed;inset:0;background:rgba(6,34,48,.66);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.overlay[hidden]{display:none}
.dlg{background:var(--panel);border-radius:26px;width:100%;max-width:580px;max-height:100%;overflow:auto;padding:20px 22px 22px;box-shadow:0 10px 0 rgba(0,0,0,.2)}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dk{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--coral)}
.dh h2{margin:0;font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1}
.x{background:#e5f4f2;border:0;border-radius:50%;width:38px;height:38px;font-size:22px;line-height:1;font-weight:700}
.dots{display:flex;gap:8px;margin:12px 0 16px}
.dot{flex:1;height:8px;border-radius:99px;background:#d6ebe8}
.dot.cur{background:#7cc3c9}
.dot.ok{background:var(--good)}
.dot.no{background:var(--bad)}
.q{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.2;margin:0 0 14px;text-wrap:balance}
.q.big{font-size:40px;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 18px}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:2px 0 18px}
.seq span{min-width:52px;padding:8px 10px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:12px;font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.seq span.qm{background:var(--coral);border-color:var(--coral);color:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{min-height:54px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;font-size:17px;text-align:center;font-variant-numeric:tabular-nums}
.opt:hover:not(:disabled){border-color:#7cc3c9}
.opt.good{background:#dff5e6;border-color:var(--good)}
.opt.bad{background:#fde3df;border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{min-height:48px;margin:14px 0 0;font-weight:700}
.fb.good{color:#1f7a43}
.fb.bad{color:#9b2b21}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.hint{margin:0 0 14px;font-weight:700;color:#3f6370}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px}
.slots.shake{animation:shake .45s}
.slot{width:44px;height:54px;border-radius:12px;background:#fff;border:2px dashed #a9cfd1;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px;font-weight:800}
.slot.on{border-style:solid;border-color:#7cc3c9}
.slots.good .slot{background:#dff5e6;border:2px solid var(--good)}
.slots.bad .slot{background:#fde3df;border:2px solid var(--bad)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:48px;height:54px;border-radius:12px;border:0;background:#ffd166;box-shadow:0 4px 0 #d9a93a;font-family:var(--display);font-size:26px;font-weight:800}
.tile:disabled{background:#e3ece9;box-shadow:none;color:#e3ece9;transform:translateY(3px)}
.ctrl{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.sum{text-align:center;padding:6px 0 0}
.sum .big{font-family:var(--display);font-size:56px;font-weight:800;line-height:1;margin:4px 0}
.sum p{margin:6px 0}
.gains{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.gains .chip{font-size:20px}
/* bölge sekmeleri */
.tabs{display:flex;gap:6px;padding:10px 12px;background:#0f5f7d;flex-wrap:wrap}
.tab{flex:1;min-width:84px;border:0;border-radius:14px;padding:8px 10px;background:rgba(255,255,255,.14);color:#fff;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1;display:flex;flex-direction:column;align-items:center}
.tab small{font-family:var(--body);font-weight:700;font-size:11.5px;opacity:.85}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tab.locked{opacity:.75}
.tab.ready{outline:2px dashed #ffd166;outline-offset:-3px}
/* sahne canlılığı */
.cloud{animation:cloud 38s linear infinite}
@keyframes cloud{from{transform:translateX(-260px)}to{transform:translateX(1060px)}}
.bob{animation:bob 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{from{transform:translateY(-2px) rotate(-2deg)}to{transform:translateY(3px) rotate(2deg)}}
.sway{animation:sway 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.glow{animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.35}to{opacity:.85}}
.spark{animation:spark 1.1s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes spark{from{opacity:1;transform:scale(.3)}to{opacity:0;transform:scale(1.6)}}
.fly{animation:fly 22s linear infinite}
@keyframes fly{from{transform:translate(-120px,0)}to{transform:translate(940px,-40px)}}
/* hafıza ve eşleştirme */
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.mcard{min-height:78px;border-radius:16px;border:0;background:linear-gradient(160deg,#1a86a3,#0a3f58);color:#fff;font-family:var(--display);font-weight:800;font-size:19px;padding:6px;box-shadow:0 4px 0 #062a3a;transition:transform .15s}
.mcard.up{background:#fff;color:var(--ink);box-shadow:0 4px 0 #b8d6d2;border:2px solid var(--line)}
.mcard.done{background:#dff5e6;color:#1f7a43;border:2px solid var(--good);box-shadow:none}
.mcard:not(.up):not(.done):hover{transform:translateY(-2px)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{min-height:50px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:17px;padding:6px 8px}
.mt.sel{border-color:var(--coral);background:#fff1ec}
.mt.done{background:#dff5e6;border-color:var(--good);color:#1f7a43}
.mt.no{background:#fde3df;border-color:var(--bad);animation:shake .4s}
.lockrow .sub{white-space:normal}
/* oyuncu girişi */
.who{display:inline-flex;align-items:center;gap:8px;padding:3px 14px 3px 3px}
.who svg{width:32px;height:32px;display:block}
.login{max-width:520px}
.lt{font-family:var(--display);font-size:30px;font-weight:800;margin:0 0 4px}
.lsub{margin:0 0 16px;font-weight:700;color:#3f6370}
.plist{display:grid;gap:10px;margin-bottom:18px}
.pitem{display:flex;gap:6px;align-items:stretch}
.pbtn{flex:1;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:18px;padding:8px 14px 8px 8px;min-width:0}
.pbtn:hover{border-color:var(--sea)}
.pbtn.cur{border-color:var(--good)}
.pbtn strong{font-family:var(--display);font-size:21px;display:block;line-height:1.1}
.pbtn span{font-size:14px;color:#4d6c77;font-weight:700}
.pbtn svg{width:54px;height:54px;flex:none}
.pdel{background:transparent;border:0;color:#9b2b21;font-weight:800;padding:0 8px;font-size:14px}
.newp{background:#fff;border-radius:18px;padding:14px 16px;border:2px dashed #a9cfd1}
.newp h3{margin:0 0 10px;font-family:var(--display);font-size:21px}
.newp label{display:flex;flex-direction:column;gap:6px;font-weight:800}
.newp input{font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);color:var(--ink);background:#fff}
.avs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
.av{border:3px solid transparent;border-radius:50%;padding:2px;background:none}
.av[aria-checked="true"]{border-color:var(--coral)}
.av svg{width:50px;height:50px;display:block}
.lnote{font-size:13px;color:#4d6c77;margin:12px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Bilgi Adası</h1>
      <p>Bulmacaları çöz, kaynak topla, adanı büyüt.</p>
    </div>
    <div class="bar">
      <button id="who" class="ghost who" type="button" aria-label="Oyuncu değiştir"></button>
      <div id="res" class="bar" aria-label="Kaynaklar"></div>
      <button id="mute" class="ghost" type="button" aria-pressed="false">Ses açık</button>
    </div>
  </header>

  <main>
    <section class="stage" aria-label="Adan">
      <nav class="tabs" id="tabs" aria-label="Bölgeler"></nav>
      <svg id="island" viewBox="0 0 800 520" role="group" aria-label="Ada haritası">
        <defs>
          <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4cc9d6"/>
            <stop offset=".55" stop-color="#1f93b5"/>
            <stop offset="1" stop-color="#11678f"/>
          </linearGradient>
          <radialGradient id="shallow" cx=".5" cy=".5" r=".5">
            <stop offset=".78" stop-color="#9eeaf0" stop-opacity=".75"/>
            <stop offset="1" stop-color="#9eeaf0" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="sandG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fbe7b8"/><stop offset="1" stop-color="#e8c47e"/>
          </linearGradient>
          <radialGradient id="grassKoy" cx=".42" cy=".35" r=".75">
            <stop offset="0" stop-color="#9ad97f"/><stop offset="1" stop-color="#4fa24e"/>
          </radialGradient>
          <radialGradient id="grassKasaba" cx=".42" cy=".35" r=".75">
            <stop offset="0" stop-color="#b5dd7a"/><stop offset="1" stop-color="#5f9f45"/>
          </radialGradient>
          <radialGradient id="grassIlce" cx=".42" cy=".35" r=".75">
            <stop offset="0" stop-color="#8fd18a"/><stop offset="1" stop-color="#3c8a55"/>
          </radialGradient>
          <radialGradient id="sunG"><stop offset="0" stop-color="#fff6c9"/><stop offset="1" stop-color="#fff6c9" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="800" height="520" fill="url(#seaG)"/>
        <circle cx="720" cy="60" r="90" fill="url(#sunG)" opacity=".55"/>
        <g id="waves"></g>
        <g id="ground"></g>
        <g id="dyn"></g>
        <g id="sky" pointer-events="none"></g>
      </svg>
      <div class="status" id="status" aria-live="polite"></div>
    </section>

    <aside class="side">
      <section class="card" id="levelCard"></section>
      <section class="card">
        <h2 id="bTitle">Binalar</h2>
        <ul class="list" id="blist"></ul>
      </section>
      <section class="card">
        <h2>Süsler</h2>
        <div class="decs" id="decs"></div>
        <button id="undo" class="btn alt undo" type="button">Son süsü geri al</button>
        <p class="note">Bir süs seç, sonra adada bir yere dokun. Kayığı denize koy.</p>
      </section>
    </aside>
  </main>

  <footer>
    <span>Oyuncular ve ilerlemeleri yalnızca bu cihazda saklanır.</span>
    <button id="reset" type="button">Adayı sıfırla</button>
  </footer>
</div>

<div id="modal" class="overlay" hidden>
  <div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" tabindex="-1"><div id="dlgBody"></div></div>
</div>
<div id="login" class="overlay" hidden>
  <div class="dlg login" role="dialog" aria-modal="true" aria-labelledby="loginTitle" tabindex="-1"><div id="loginBody"></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var rnd=function(a,b){return Math.floor(Math.random()*(b-a+1))+a;};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(0,i);var t=a[i];a[i]=a[j];a[j]=t;}return a;};

/* ---------- veriler ---------- */
var ICON='viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"';
var RES={
  odun:{name:'Odun',svg:'<svg '+ICON+'><rect x="2" y="5" width="16" height="10" rx="3" fill="#b9773f"/><ellipse cx="15" cy="10" rx="3" ry="5" fill="#e3b27a"/><circle cx="15" cy="10" r="1.4" fill="#b9773f"/></svg>'},
  tas:{name:'Taş',svg:'<svg '+ICON+'><path d="M3 14 L6 6 L12 4 L17 9 L15 15 Z" fill="#9aa8b3" stroke="#6d7b86" stroke-width="1" stroke-linejoin="round"/></svg>'},
  tohum:{name:'Tohum',svg:'<svg '+ICON+'><path d="M10 2 C16 6 16 14 10 18 C4 14 4 6 10 2Z" fill="#6cc24a"/><path d="M10 6 V16" stroke="#3f8f2f" stroke-width="1.4"/></svg>'}
};
var RKEYS=['odun','tas','tohum'];
var OL='<g stroke="#10303c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">';

var REGIONS=[
  {id:'koy',name:'Köy',need:null,cost:{}},
  {id:'kasaba',name:'Kasaba',need:'koy',cost:{odun:8,tas:8,tohum:8}},
  {id:'ilce',name:'İlçe',need:'kasaba',cost:{odun:14,tas:14,tohum:14}}
];
var WIN='fill="#bfe6f5"';

function defaults(){return {res:{odun:0,tas:0,tohum:0},built:['kutuphane'],decor:[],played:0,mute:false,regions:['koy'],view:'koy'};}
function sane(s){
  var d=defaults();
  if(!s||typeof s!=='object'||!Array.isArray(s.built)) return null;
  d.res={odun:+(s.res&&s.res.odun)||0,tas:+(s.res&&s.res.tas)||0,tohum:+(s.res&&s.res.tohum)||0};
  d.built=s.built.filter(function(id){return BUILDINGS.some(function(b){return b.id===id;});});
  if(d.built.indexOf('kutuphane')<0) d.built.unshift('kutuphane');
  d.regions=(Array.isArray(s.regions)?s.regions:[]).filter(function(r){return rById(r);});
  if(d.regions.indexOf('koy')<0) d.regions.unshift('koy');
  d.view=d.regions.indexOf(s.view)>=0?s.view:'koy';
  d.built=d.built.filter(function(id){return d.regions.indexOf(bById(id).region)>=0;});
  d.decor=(Array.isArray(s.decor)?s.decor:[]).filter(function(x){return x&&DECOR[x.id]&&isFinite(x.x)&&isFinite(x.y);}).map(function(x){return {id:x.id,x:x.x,y:x.y,r:rById(x.r)?x.r:'koy'};});
  d.played=+s.played||0; d.mute=!!s.mute;
  return d;
}

function costText(cost){var t=Object.keys(cost).map(function(k){return cost[k]+' '+RES[k].name.toLowerCase();});return t.length?t.join(' · '):'ücretsiz';}

function beep(f,d,type){
  if(state&&state.mute) return;

    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=f;g.gain.value=0.05;

    g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+(d||0.14));o.stop(ac.currentTime+(d||0.14));
  }catch(e){}
}

/* ---------- soru üreticiler ---------- */
function opts(ans,extra){
  var c=[ans+1,ans-1,ans+2,ans-2,ans+10,ans-10].concat(extra||[]);
  var seen={};seen[ans]=1;
  c=c.filter(function(v){if(v<0||seen[v])return false;seen[v]=1;return true;});
  var list=shuffle([ans].concat(shuffle(c).slice(0,3)));
  return {options:list.map(String),answer:list.indexOf(ans)};
}
function seqQ(){
  var t=rnd(0,4),s=[],ans,rule,i;
  if(t===0){var a=rnd(1,20),d=rnd(2,9);for(i=0;i<5;i++)s.push(a+d*i);ans=a+d*5;rule='Her adımda '+d+' artıyor.';}
  else if(t===1){var a1=rnd(1,4),r=rnd(2,3);for(i=0;i<5;i++)s.push(a1*Math.pow(r,i));ans=a1*Math.pow(r,5);rule='Her sayı, öncekinin '+r+' katı.';}
  else if(t===2){var x=rnd(1,10),p=rnd(1,5),q=rnd(p+1,p+5);s=[x];for(i=0;i<4;i++)s.push(s[i]+(i%2===0?p:q));ans=s[4]+p;rule='Sırayla +'+p+' ve +'+q+' ekleniyor.';}
  else if(t===3){var k=rnd(1,5);for(i=0;i<5;i++)s.push((k+i)*(k+i));ans=(k+5)*(k+5);rule='Ardışık sayıların kareleri.';}
  else{var a2=rnd(40,80),d2=rnd(3,8);for(i=0;i<5;i++)s.push(a2-d2*i);ans=a2-d2*5;rule='Her adımda '+d2+' azalıyor.';}
  var o=opts(ans);
  return {kind:'mc',prompt:'Sıradaki sayı hangisi?',seq:s,options:o.options,answer:o.answer,explain:rule};
}
function mathQ(){
  var t=rnd(0,3),q,a,x,y;
  if(t===0){x=rnd(12,89);y=rnd(11,68);q=x+' + '+y;a=x+y;}
  else if(t===1){x=rnd(40,99);y=rnd(11,x-10);q=x+' − '+y;a=x-y;}
  else if(t===2){x=rnd(3,12);y=rnd(3,12);q=x+' × '+y;a=x*y;}
  else{y=rnd(3,9);x=rnd(3,12);q=(x*y)+' ÷ '+y;a=x;}
  var o=opts(a,[a+3,a-3]);
  return {kind:'mc',prompt:q+' = ?',big:true,options:o.options,answer:o.answer,explain:q+' = '+a};
}
function bankQ(item){
  var list=shuffle(item.o);
  return {kind:'mc',prompt:item.q,options:list,answer:list.indexOf(item.o[0]),explain:item.e};
}
function anaQ(w){
  var letters=Array.from(w.w),mix=shuffle(letters),n=0;
  while(mix.join('')===w.w&&n++<20) mix=shuffle(letters);
  return {kind:'ana',word:w.w,hint:w.h,tiles:mix.map(function(c){return {ch:c,used:false};}),ans:[],locked:false};
}
/* Havuz bitene kadar aynı soruyu tekrar sormaz; son görülenler cihazda saklanır. */
function seenKey(){return 'bilgiAdasi.seen.'+(prof?prof.id:'');}
var seen={};
function loadSeen(){try{var v=JSON.parse(localStorage.getItem(seenKey()));seen=v&&typeof v==='object'?v:{};}catch(e){seen={};}}
function pick(key,list,n){
  var r=Array.isArray(seen[key])?seen[key]:[];
  var idx=list.map(function(_,i){return i;});
  var fresh=shuffle(idx.filter(function(i){return r.indexOf(i)<0;}));
  var stale=shuffle(idx.filter(function(i){return r.indexOf(i)>=0;}));
  var chosen=fresh.concat(stale).slice(0,n);
  seen[key]=r.filter(function(i){return chosen.indexOf(i)<0&&i<list.length;}).concat(chosen).slice(-Math.max(0,list.length-n));
  try{localStorage.setItem(seenKey(),JSON.stringify(seen));}catch(e){}
  return chosen.map(function(i){return list[i];});
}
function problemQ(){
  var t=rnd(0,3),q,a,x,y;
  var meyve=['elma','armut','portakal','şeftali'][rnd(0,3)];
  if(t===0){x=rnd(2,9);y=rnd(3,9);q='Bir '+meyve+' '+x+' TL. '+y+' tane '+meyve+' kaç TL eder?';a=x*y;}
  else if(t===1){x=[20,50,100][rnd(0,2)];y=rnd(5,x-3);q=x+' TL ile '+y+' TL\'lik bir oyuncak aldın. Kaç TL para üstü alırsın?';a=x-y;}
  else if(t===2){y=rnd(2,6);a=rnd(3,9);x=a*y;q=x+' ceviz '+y+' arkadaşa eşit paylaştırılıyor. Her biri kaç ceviz alır?';}
  else{x=rnd(12,48);y=rnd(8,40);var z=rnd(3,Math.min(15,x+y-1));q='Tezgâhta '+x+' elma ve '+y+' armut vardı. '+z+' meyve satıldı. Kaç meyve kaldı?';a=x+y-z;}
  var o=opts(a,[a+5,a-5]);
  return {kind:'mc',prompt:q,options:o.options,answer:o.answer,explain:'Cevap: '+a+'.'};
}
function clock(t){t=((t%720)+720)%720;var h=Math.floor(t/60),m=t%60;return (h===0?12:h)+':'+(m<10?'0':'')+m;}
function saatQ(){
  var start=rnd(1,11)*60+rnd(0,11)*5,add=rnd(2,20)*5,ans=start+add;
  var c=[ans+15,ans-15,ans+60,ans-60,ans+5,ans-10,ans+30],seen={},list=[ans];seen[clock(ans)]=1;
  shuffle(c).forEach(function(v){if(list.length<4&&!seen[clock(v)]){seen[clock(v)]=1;list.push(v);}});
  list=shuffle(list);
  var dur=add>=60?Math.floor(add/60)+' saat'+(add%60?' '+add%60+' dakika':''):add+' dakika';
  return {kind:'mc',prompt:'Saat '+clock(start)+'. '+dur+' sonra saat kaç olur?',options:list.map(clock),answer:list.indexOf(ans),explain:clock(start)+' + '+dur+' = '+clock(ans)};
}
function memQ(pairs){
  var cards=[];
  pairs.forEach(function(p,k){cards.push({t:p[0],p:k,open:false,done:false});cards.push({t:p[1],p:k,open:false,done:false});});
  return {kind:'mem',cards:shuffle(cards),first:null,miss:0,busy:false};
}
function carpimPairs(){
  var out=[],used={};
  while(out.length<3){var a=rnd(3,9),b=rnd(3,9);if(used[a*b])continue;used[a*b]=1;out.push([a+' × '+b,String(a*b)]);}
  return out;
}
function matchQ(pairs){
  return {kind:'match',L:shuffle(pairs.map(function(p,k){return {t:p[0],p:k};})),R:shuffle(pairs.map(function(p,k){return {t:p[1],p:k};})),sel:null,done:{},miss:0,bad:null};
}
var LONG=WORDS.filter(function(w){return Array.from(w.w).length>=6;});
function makeQs(b){
  if(b.game==='anagram'&&b.words==='uzun') return pick('uzun',LONG,3).map(anaQ);
  if(b.game==='anagram') return pick('kelime',WORDS,3).map(anaQ);
  if(b.game==='dy') return pick('dy',TF,3).map(function(x){return {kind:'mc',prompt:x.s,options:['Doğru','Yanlış'],answer:x.t?0:1,explain:x.e};});
  if(b.game==='problem') return [problemQ(),problemQ(),problemQ()];
  if(b.game==='saat') return [saatQ(),saatQ(),saatQ()];
  if(b.game==='hafiza'&&b.set==='carpim') return [memQ(carpimPairs()),memQ(carpimPairs()),memQ(carpimPairs())];
  if(b.game==='hafiza'){var bp=pick('baskent',BASKENT,9);return [memQ(bp.slice(0,3)),memQ(bp.slice(3,6)),memQ(bp.slice(6,9))];}
  if(b.game==='eslestir'){var ep=pick('esanlam',ESANLAM,12);return [matchQ(ep.slice(0,4)),matchQ(ep.slice(4,8)),matchQ(ep.slice(8,12))];}
  if(b.game==='quiz') return pick(b.cat,BANK[b.cat],3).map(bankQ);
  if(b.game==='dizi') return [seqQ(),seqQ(),seqQ()];
  return [mathQ(),mathQ(),mathQ()];
}

/* ---------- bulmaca penceresi ---------- */
function openModal(){var m=$('#modal');m.hidden=false;$('#dlg').scrollTop=0;$('#dlg').focus();}
function closeModal(){$('#modal').hidden=true;round=null;refresh();}
function head(b){
  return '<div class="dh"><div><div class="dk">'+b.skill+'</div><h2 id="dlgTitle">'+b.name+'</h2></div><button type="button" class="x" data-close aria-label="Kapat">×</button></div>'+
    '<div class="dots" aria-label="Soru '+(round.i+1)+' / '+round.qs.length+'">'+round.qs.map(function(_,i){
      return '<span class="dot'+(i<round.i?(round.res[i]?' ok':' no'):(i===round.i?' cur':''))+'"></span>';}).join('')+'</div>';
}
function startRound(b){
  round={b:b,qs:makeQs(b),i:0,res:[],locked:false};
  renderQ();openModal();
}
function renderQ(){
  round.locked=false;
  var q=round.qs[round.i],h=head(round.b),body='';
  if(q.kind==='mc'){
    body=(q.big?'<p class="q big">'+q.prompt+'</p>':'<p class="q">'+q.prompt+'</p>');
    if(q.seq) body+='<div class="seq">'+q.seq.map(function(n){return '<span>'+n+'</span>';}).join('')+'<span class="qm">?</span></div>';
    body+='<div class="opts">'+q.options.map(function(o,i){return '<button type="button" class="opt" data-opt="'+i+'">'+o+'</button>';}).join('')+'</div>';
  }else if(q.kind==='mem'){
    body='<p class="q">Eşleri bul: '+(round.b.set==='carpim'?'her işlemi sonucuyla':'her ülkeyi başkentiyle')+' eşleştir.</p><div class="memgrid" id="mem">'+memHTML(q)+'</div><p class="hint" id="memInfo">Hata: 0 · En fazla 3 hatayla bitirirsen tur senin.</p>';
  }else if(q.kind==='match'){
    body='<p class="q">Eş anlamlıları eşleştir.</p><p class="hint">Önce soldan bir kelime, sonra sağdan eşini seç.</p><div class="match" id="match">'+matchHTML(q)+'</div><p class="hint" id="mInfo">Hata: 0 · En fazla 1 hatayla bitirirsen tur senin.</p>';
  }else{
    body='<p class="q">Harfleri doğru sıraya diz.</p><p class="hint">İpucu: '+q.hint+'</p>'+
      '<div class="slots" id="slots">'+q.tiles.map(function(_,i){var t=q.ans[i]!==undefined?q.tiles[q.ans[i]].ch:'';return '<span class="slot'+(t?' on':'')+'">'+t+'</span>';}).join('')+'</div>'+
      '<div class="tiles">'+q.tiles.map(function(t,i){return '<button type="button" class="tile" data-tile="'+i+'"'+(t.used?' disabled':'')+'>'+t.ch+'</button>';}).join('')+'</div>'+
      '<div class="ctrl"><button type="button" class="btn alt" data-ana="back">Geri al</button><button type="button" class="btn alt" data-ana="mix">Karıştır</button><button type="button" class="btn alt" data-ana="skip">Pas geç</button></div>';
  }
  body+='<p class="fb" id="fb" aria-live="polite"></p><div class="foot" id="foot"></div>';
  $('#dlgBody').innerHTML=h+body;
  round.locked=false;
}
function memHTML(q){
  return q.cards.map(function(c,i){var show=c.open||c.done;
    return '<button type="button" class="mcard'+(show?' up':'')+(c.done?' done':'')+'" data-card="'+i+'"'+(c.done||round.locked?' disabled':'')+' aria-label="'+(show?c.t:'Kapalı kart')+'">'+(show?c.t:'?')+'</button>';}).join('');
}
function memDraw(){var q=round.qs[round.i];$('#mem').innerHTML=memHTML(q);$('#memInfo').textContent='Hata: '+q.miss+' · En fazla 3 hatayla bitirirsen tur senin.';}
function memFlip(i){
  var q=round.qs[round.i];
  if(round.locked||q.busy) return;
  var c=q.cards[i];
  if(c.done||c.open) return;
  c.open=true;
  if(q.first===null){q.first=i;beep(520,.06);memDraw();return;}
  var a=q.cards[q.first];
  if(a.p===c.p){
    a.done=c.done=true;a.open=c.open=false;q.first=null;beep(760,.1);memDraw();
    if(q.cards.every(function(x){return x.done;})){var ok=q.miss<=3;finishQ(ok,ok?'Hepsini buldun! '+q.miss+' hata.':'Hepsini buldun ama '+q.miss+' hata yaptın. 3 ya da daha az hatayla tur senin olur.');memDraw();}
  }else{
    q.miss++;q.busy=true;memDraw();beep(240,.12,'triangle');
    var cur=round.i;
    setTimeout(function(){if(!round||round.i!==cur)return;a.open=c.open=false;q.first=null;q.busy=false;memDraw();},850);
  }
}
function matchHTML(q){
  var col=function(list,side){return '<div class="col">'+list.map(function(x,i){var d=q.done[x.p];
    var cls='mt'+(d?' done':'')+(side==='l'&&q.sel===i?' sel':'')+(side==='r'&&q.bad===i?' no':'');
    return '<button type="button" class="'+cls+'" data-m'+side+'="'+i+'"'+(d||round.locked?' disabled':'')+'>'+x.t+'</button>';}).join('')+'</div>';};
  return col(q.L,'l')+col(q.R,'r');
}
function matchDraw(){var q=round.qs[round.i];$('#match').innerHTML=matchHTML(q);$('#mInfo').textContent='Hata: '+q.miss+' · En fazla 1 hatayla bitirirsen tur senin.';}
function matchPick(side,i){
  var q=round.qs[round.i];
  if(round.locked) return;
  if(side==='l'){if(q.done[q.L[i].p])return;q.sel=i;q.bad=null;beep(520,.05);matchDraw();return;}
  var r=q.R[i];
  if(q.done[r.p]) return;
  if(q.sel===null){toast('Önce soldan bir kelime seç.');return;}
  if(q.L[q.sel].p===r.p){
    q.done[r.p]=1;q.sel=null;q.bad=null;beep(760,.1);matchDraw();
    if(Object.keys(q.done).length===q.L.length){var ok=q.miss<=1;finishQ(ok,ok?'Hepsi doğru eşleşti!':'Eşleştirdin ama '+q.miss+' hata yaptın.');matchDraw();}
  }else{q.miss++;q.bad=i;q.sel=null;beep(240,.12,'triangle');matchDraw();}
}
function finishQ(ok,msg){
  round.locked=true;round.res[round.i]=ok;
  var fb=$('#fb');fb.className='fb '+(ok?'good':'bad');fb.textContent=msg;
  var last=round.i===round.qs.length-1;
  $('#foot').innerHTML='<button type="button" class="btn" data-next>'+(last?'Sonucu gör':'Devam')+'</button>';
  var nb=$('[data-next]');if(nb) nb.focus();
  ok?good():bad();
}
function answerMC(i){
  if(round.locked) return;
  var q=round.qs[round.i],btns=document.querySelectorAll('.opt');
  btns.forEach(function(b,k){b.disabled=true;if(k===q.answer)b.classList.add('good');else if(k===i)b.classList.add('bad');});
  var ok=i===q.answer;
  finishQ(ok,(ok?'Doğru! ':'Olmadı. Doğru cevap: '+q.options[q.answer]+'. ')+q.explain);
}
function anaUpdate(){
  var q=round.qs[round.i];
  $('#slots').innerHTML=q.tiles.map(function(_,i){var t=q.ans[i]!==undefined?q.tiles[q.ans[i]].ch:'';return '<span class="slot'+(t?' on':'')+'">'+t+'</span>';}).join('');
  document.querySelectorAll('.tile').forEach(function(b,i){b.disabled=q.tiles[i].used||q.locked;});
}
function anaAdd(i){
  var q=round.qs[round.i];
  if(round.locked||q.tiles[i].used) return;
  q.tiles[i].used=true;q.ans.push(i);anaUpdate();
  if(q.ans.length===q.tiles.length){
    var guess=q.ans.map(function(k){return q.tiles[k].ch;}).join('');
    var s=$('#slots');
    if(guess===q.word){s.classList.add('good');finishQ(true,'Doğru! '+q.word+'.');anaUpdate();}
    else{
      s.classList.add('bad','shake');bad();
      $('#fb').className='fb bad';$('#fb').textContent='Olmadı, tekrar dene.';
      var cur=round.i;
      setTimeout(function(){
        if(!round||round.i!==cur||round.locked) return;
        q.tiles.forEach(function(t){t.used=false;});q.ans=[];
        $('#fb').textContent='';anaUpdate();s.classList.remove('bad','shake');
      },700);
    }
  }
}
function anaBack(){
  var q=round.qs[round.i];
  if(round.locked||!q.ans.length) return;
  q.tiles[q.ans.pop()].used=false;anaUpdate();
}
function anaMix(){
  var q=round.qs[round.i];
  if(round.locked) return;
  q.tiles=shuffle(q.tiles.map(function(t){return {ch:t.ch,used:false};}));q.ans=[];
  renderQ();
}
function anaSkip(){
  var q=round.qs[round.i];
  if(round.locked) return;
  q.ans=[];q.tiles.forEach(function(t){t.used=true;});
  var rem=Array.from(q.word);
  q.tiles.forEach(function(t,i){var j=rem.indexOf(t.ch);if(j>=0)rem[j]=null;});
  $('#slots').innerHTML=Array.from(q.word).map(function(c){return '<span class="slot on">'+c+'</span>';}).join('');
  $('#slots').classList.add('bad');
  document.querySelectorAll('.tile').forEach(function(b){b.disabled=true;});
  finishQ(false,'Cevap: '+q.word+'. Bir sonrakinde görüşürüz.');
}
function nextQ(){
  if(round.i<round.qs.length-1){round.i++;renderQ();return;}
  var right=round.res.filter(Boolean).length,perfect=right===round.qs.length;
  var gain=right+(perfect?1:0),k=round.b.res,bump={};
  state.res[k]+=gain;state.played++;bump[k]=1;save();
  $('#dlgBody').innerHTML=head(round.b).replace(/<div class="dots".*?<\/div>/,'')+
    '<div class="sum"><div class="big">'+right+' / '+round.qs.length+'</div>'+
    '<p><strong>'+(perfect?'Kusursuz tur! Bir bonus kazandın.':right>0?'Güzel gidiyorsun.':'Bu sefer olmadı, yeni tur seni bekliyor.')+'</strong></p>'+
    '<div class="gains"><span class="chip">'+RES[k].svg+'+'+gain+' '+RES[k].name.toLowerCase()+'</span></div></div>'+
    '<div class="foot"><button type="button" class="btn alt" data-close>Adaya dön</button><button type="button" class="btn" data-again>Tekrar oyna</button></div>';
  renderRes(bump);
}

/* ---------- olaylar ---------- */
$('#island').addEventListener('click',function(e){
  if(selDecor){placeDecor(svgPoint(e));return;}
  var p=e.target.closest('[data-plot]');
  if(p) openBuilding(p.getAttribute('data-plot'));
});
$('#island').addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  var p=e.target.closest&&e.target.closest('[data-plot]');
  if(p){e.preventDefault();openBuilding(p.getAttribute('data-plot'));}
});
$('#blist').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b) return;
  if(b.getAttribute('data-act')==='unlock') unlockRegion(b.getAttribute('data-id'));
  else openBuilding(b.getAttribute('data-id'));
});
$('#tabs').addEventListener('click',function(e){
  var t=e.target.closest('[data-tab]');
  if(!t) return;
  state.view=t.getAttribute('data-tab');selDecor=null;save();refresh();
});
$('#decs').addEventListener('click',function(e){
  var b=e.target.closest('[data-dec]');
  if(!b) return;
  var k=b.getAttribute('data-dec');
  selDecor=selDecor===k?null:k;
  refresh();
});
$('#undo').addEventListener('click',undoDecor);
$('#mute').addEventListener('click',function(){state.mute=!state.mute;save();refresh();});
$('#reset').addEventListener('click',function(){
  var b=$('#reset');
  if(!resetArm){resetArm=true;b.textContent='Emin misin? Tekrar dokun';setTimeout(function(){resetArm=false;b.textContent='Adayı sıfırla';},3500);return;}
  resetArm=false;b.textContent='Adayı sıfırla';state=defaults();selDecor=null;save();refresh();toast('Ada sıfırlandı.');
});
$('#modal').addEventListener('click',function(e){
  if(e.target.closest('[data-close]')||e.target.id==='modal'){closeModal();return;}
  if(!round) return;
  var o=e.target.closest('[data-opt]');if(o){answerMC(+o.getAttribute('data-opt'));return;}
  var t=e.target.closest('[data-tile]');if(t){anaAdd(+t.getAttribute('data-tile'));return;}
  var mc=e.target.closest('[data-card]');if(mc){memFlip(+mc.getAttribute('data-card'));return;}
  var ml=e.target.closest('[data-ml]');if(ml){matchPick('l',+ml.getAttribute('data-ml'));return;}
  var mr=e.target.closest('[data-mr]');if(mr){matchPick('r',+mr.getAttribute('data-mr'));return;}
  var a=e.target.closest('[data-ana]');
  if(a){var m=a.getAttribute('data-ana');if(m==='back')anaBack();else if(m==='mix')anaMix();else anaSkip();return;}
  if(e.target.closest('[data-next]')){nextQ();return;}
  if(e.target.closest('[data-again]')){startRound(round.b);return;}
});
$('#who').addEventListener('click',openLogin);
$('#login').addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-prof]'))){selectProfile(t.getAttribute('data-prof'));return;}
  if((t=e.target.closest('[data-pdel]'))){deleteProfile(t.getAttribute('data-pdel'));return;}
  if((t=e.target.closest('[data-av]'))){newAv=t.getAttribute('data-av');document.querySelectorAll('.av').forEach(function(b){b.setAttribute('aria-checked',String(b===t));});return;}
  if(e.target.closest('[data-lclose]')||e.target.id==='login') closeLogin();
});
$('#login').addEventListener('submit',function(e){e.preventDefault();createProfile($('#pname').value,newAv);});
document.addEventListener('keydown',function(e){
  if(!$('#login').hidden){if(e.key==='Escape')closeLogin();return;}
  if($('#modal').hidden) return;
  if(e.key==='Escape'){closeModal();return;}
  if(!round||round.locked) return;
  var q=round.qs[round.i];
  if(q.kind!=='ana'||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='Backspace'){e.preventDefault();anaBack();return;}
  if(e.key.length!==1) return;
  var K=e.key.toLocaleUpperCase('tr'),idx=-1;
  q.tiles.forEach(function(t,i){if(idx<0&&!t.used&&t.ch===K)idx=i;});
  if(idx<0){var K2=e.key.toUpperCase();q.tiles.forEach(function(t,i){if(idx<0&&!t.used&&t.ch.toUpperCase()===K2)idx=i;});}
  if(idx>=0){e.preventDefault();anaAdd(idx);}
});

/* ---------- açılış ---------- */
function start(data){
  profiles=loadProfiles();
  buildWaves();$('#sky').innerHTML=skySVG();
  var cur=profiles.list.filter(function(p){return p.id===profiles.current;})[0];
  if(cur){selectProfile(cur.id,true);var hs=sane(data);if(hs){state=hs;refresh();}}
  else{prof=null;state=defaults();refresh();openLogin();}
}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot) window.claude.hot.snapshot(function(){return state;});
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data);
})();
